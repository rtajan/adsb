[build-system]
requires = ["scikit-build-core",
            "setuptools_scm",
            "pybind11>=3.0.0",
            "pybind11-stubgen"
            ]
build-backend = "scikit_build_core.build"

[project]
name = "adsb"
authors = [{name = "Romain Tajan", email= "romain.tajan@bordeaux-inp.fr"}]
requires-python = ">=3.8"
description = "ADS-B signal processing tools."
#license = {file = "LICENSE"}
readme = "README.md"
dependencies = [
    "importlib_metadata",
    "mkdocstrings-python",
]
dynamic = ["version"]

[tool.scikit-build]
build-dir = "build"
cmake.define.CMAKE_CXX_FLAGS ="-Wall -funroll-loops -fvisibility=hidden -fvisibility-inlines-hidden"
wheel.packages = ["adsb"]
# wheel.license-files = ["LICENSE"]
wheel.install-dir = "adsb"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["adsb/_version.py"]

[tool.setuptools_scm]  # Section required
write_to = "adsb/_version.py"
version_scheme = "post-release"

[[tool.scikit-build.generate]]
path = "adsb/_version.py"
template = '''
version = "${version}"
'''
